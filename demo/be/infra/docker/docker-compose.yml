services:
  mysql:
    image: mysql:8.0
    container_name: memoryrag-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: memoryrag
      MYSQL_USER: memoryrag
      MYSQL_PASSWORD: memoryrag
    volumes:
      - memoryrag_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memoryrag_mysql_data:
