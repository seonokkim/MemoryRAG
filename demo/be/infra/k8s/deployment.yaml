apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-rag-be
  namespace: memory-rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-rag-be
  template:
    metadata:
      labels:
        app: memory-rag-be
    spec:
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT/REPO/memory-rag-be:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: memory-rag-be-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-rag-be-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
