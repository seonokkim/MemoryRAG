steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/memoryrag-be:${SHORT_SHA}
      - -f
      - infra/docker/Dockerfile
      - .
    dir: demo/be
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/memoryrag-be:${SHORT_SHA}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - memoryrag-be
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/memoryrag-be:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated

substitutions:
  _REGION: us-central1
  _REPO: memoryrag

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/memoryrag-be:${SHORT_SHA}
