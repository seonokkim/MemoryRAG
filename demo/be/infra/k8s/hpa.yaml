apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-rag-be
  namespace: memory-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memory-rag-be
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
